[package]
name = "holdfast"
version = "0.1.0"
edition = "2024"
description = "Five small worlds. One rule: hold your ground. A keyboard-only 3D survival command roguelite."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["game", "roguelite", "bevy", "strategy"]
categories = ["games"]
repository = "https://github.com/nschmeller/holdfast"
documentation = "https://github.com/nschmeller/holdfast#readme"
homepage = "https://github.com/nschmeller/holdfast"

[lib]
name = "holdfast"
path = "src/lib.rs"
# `staticlib` for the iOS wrapper to link, `cdylib` for the Android activity to
# load, `rlib` so the binary and the tests keep using it as an ordinary crate.
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "holdfast"
path = "src/main.rs"

[features]
default = []
# Turns Bevy's ECS panics from "<Enable the debug feature to see the name>"
# into real system and component names. Costs a full rebuild of Bevy, so it is
# opt-in: `cargo run --features debug-names` when a schedule conflict appears.
debug-names = ["bevy/debug"]

# Web-only. `web-sys` is already in the tree for any wasm Bevy build; naming
# it here just lets the save system reach localStorage, since a browser has no
# filesystem to write a save file to. Native builds are untouched and still
# carry nothing but Bevy.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[dependencies]
# Zero non-Bevy dependencies on purpose: every mesh, material, sound and font
# glyph is generated at runtime, so the wasm bundle carries no asset payload
# and the iOS build needs no resource bundle.
bevy = { version = "0.19", default-features = false, features = [
    "3d",
    "ui",
    "bevy_audio",
    "wav",
    "tonemapping_luts",
] }

# Every lint group Clippy ships except `restriction` (which is a menu, not a
# standard - enabling it wholesale contradicts itself). Anything switched off
# below is switched off because it actively fights Bevy's idioms, and each one
# says why.
[lints.rust]
# `deny`, not `forbid`, for exactly one reason: iOS and Android both need a
# C-ABI entry point, and `#[unsafe(no_mangle)]` is unsafe in edition 2024.
# `forbid` cannot be granted an exception even for that. Every use is still a
# hard error unless it carries an `#[expect]` with a written reason, and today
# there are exactly two - both of them FFI entry points in `lib.rs` that
# contain no unsafe operations, only an unsafe attribute.
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
variant_size_differences = "warn"
missing_debug_implementations = "warn"

# Every Bevy system parameter is a lifetime-generic type used with its
# lifetimes elided - `Res<T>`, `Query<A, B>`, `Commands`. Writing `Res<'_, T>`
# on all several hundred of them would be noise, and it is not how any Bevy
# code is written. This is the one `rust_2018_idioms` lint the framework
# genuinely precludes; the rest of the group stays on.
elided_lifetimes_in_paths = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Bevy systems take `Res`, `Query` and `Commands` by value; that is the whole
# calling convention, not an oversight.
needless_pass_by_value = "allow"
# Query and system-param types are genuinely, unavoidably long.
type_complexity = "allow"
# Bevy's own dependency tree ships duplicate semver-major versions.
multiple_crate_versions = "allow"
# A game loop is wall-to-wall `as f32` on loop counters and indices; the casts
# are all in ranges where precision loss is impossible or irrelevant.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Tuning constants read better inline next to what they tune.
unreadable_literal = "allow"
# Systems are naturally wide; splitting them to satisfy an arg count would make
# the scheduling worse, not better.
too_many_arguments = "allow"
too_many_lines = "allow"
# `#[must_use]` on every getter in a binary crate is pure noise.
must_use_candidate = "allow"
# We are a binary; there is no public API to document panics for.
missing_panics_doc = "allow"
missing_errors_doc = "allow"
# Bevy plugin modules legitimately repeat the module name in item names.
module_name_repetitions = "allow"
# `nursery` wants `const fn` on things that cannot be const in a Bevy context.
missing_const_for_fn = "allow"
# Float comparison is fine for the sentinel values we actually compare.
float_cmp = "allow"
# Deliberate: the option/result chains this fires on are less readable rewritten.
option_if_let_else = "allow"
# Rewriting `a * b + c` as `a.mul_add(b, c)` is a pessimisation on any target
# without hardware FMA - notably wasm without the relaxed-simd proposal, where
# it lowers to a libm call. It also reads worse in the geometry and tuning
# code where it fires most.
suboptimal_flops = "allow"

[profile.dev]
opt-level = 1

# Bevy is unusably slow in a debug build; always optimise dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Size-tuned profile used for the itch.io web build.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"
